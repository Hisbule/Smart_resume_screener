version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-resume-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount a volume for persistent data (database, index files)
      - backend_data:/app
    environment:
      # Ensure the DB path inside the container matches the volume mount
      - DATABASE_URL=sqlite:////app/candidates.db
      # You can add OPENAI_API_KEY here if needed
      # - OPENAI_API_KEY=your_key_here
    networks:
      - resume-net

  frontend:
      build:
        context: ./frontened
        dockerfile: Dockerfile
        args:
          # Pass the host-accessible backend URL
          - VITE_API_URL=http://localhost:8000 # <-- TO THIS
      container_name: smart-resume-frontend
      ports:
        - "8080:80"
      depends_on:
        - backend
      networks:
        - resume-net
volumes:
  backend_data: # Define the named volume for persistence

networks:
  resume-net:
    driver: bridge